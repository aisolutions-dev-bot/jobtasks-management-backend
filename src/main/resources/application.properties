# ─── Observability: structured logs, tagged/correlated for Grafana/Loki ───────
# quarkus.application.name stamps every JSON log line with the service name
# at the app layer (on top of the VPS Alloy pipeline's own container-name
# label) — every backend adopting this framework sets its own name here.
quarkus.application.name=jobtasks-management-backend
# JSON console output — the io.quarkus:quarkus-logging-json extension (core
# Quarkus, not the quarkiverse community fork — different property namespace)
# defaults console output to JSON once the dependency is present, so only
# dev/test need to opt out for human-readable logs.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
# MDC values (requestId) land nested under a "mdc" key in the JSON line —
# queryable in Grafana/Loki via `| json` + `| line_format "{{.mdc_requestId}}"`.
# One-line-per-request summary (method/path/status/size), independent of the
# more detailed per-line logs.
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=combined

quarkus.http.port=8090

# ─── Datasource ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:dbusername}
quarkus.datasource.password=${DB_PASSWORD:dbpassword}
quarkus.datasource.reactive.url=${DB_URL:mysql://example:3306/db}
# Testcontainers replaces these at runtime; the values here only let the test profile boot.
%test.quarkus.datasource.reactive.url=mysql://localhost:3306/test
%test.quarkus.datasource.username=test
%test.quarkus.datasource.password=test
quarkus.datasource.reactive.max-size=5
quarkus.datasource.reactive.connect-timeout=10
quarkus.datasource.reactive.idle-timeout=PT2M
quarkus.datasource.reactive.max-lifetime=PT15M
quarkus.datasource.reactive.pool-cleaner-period=PT1M
quarkus.thread-pool.max-threads=10

# ─── Cache (RBAC access + staff directory — rarely change) ────────────────────
quarkus.cache.caffeine."jobtasks-rbac-access".expire-after-write=PT2M
quarkus.cache.caffeine."jobtasks-staff-list".expire-after-write=PT2M
quarkus.cache.caffeine."jobtasks-staff-dropdown".expire-after-write=PT15S

# Per-company DB routing: cache companyId -> dbName lookups (shared CompanyDbLookupService)
quarkus.cache.caffeine."company-db-lookup".expire-after-write=PT2M

# ─── CORS ─────────────────────────────────────────────────────────────────────
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4000,http://localhost:4200,http://localhost:4005,http://localhost:4008
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=X-Custom,Content-Type,authorization,X-Login-Type
quarkus.http.cors.exposed-headers=Content-Disposition,authorization
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true
%prod.quarkus.http.cors.origins=https://ai-solutions-shell-production.up.railway.app,https://aisolutionspl.com
%staging.quarkus.http.cors.origins=https://ai-solutions-shell-production.up.railway.app,https://aisolutionspl.com

# ─── Organization API (RBAC) ──────────────────────────────────────────────────
organization-api/mp-rest/url=http://localhost:8080
%prod.organization-api/mp-rest/url=${ORG_SERVICE_URL:http://ai-solutions-organization-api.railway.internal:8080}
%staging.organization-api/mp-rest/url=${ORG_SERVICE_URL}

# ─── JWT verification — org-api's published JWKS ──────────────────────────────
# quarkus-smallrye-jwt fetches and caches the key set, matches the token's
# keyId, and re-fetches on key rotation. Same ORG_SERVICE_URL as the rest
# client above, so one property across every profile.
mp.jwt.verify.publickey.location=${ORG_SERVICE_URL:http://localhost:8080}/.well-known/jwks.json
mp.jwt.verify.issuer=ai-solutions-organization-api

# ─── Service account for org-api calls ───────────────────────────────────────
app.service.username=${SERVICE_ACCOUNT_USERNAME:admin}
app.service.password=${SERVICE_ACCOUNT_PASSWORD:admin}

# ─── Service-to-service: used internally by the shared lib's ServiceTokenProvider /
# CompanyDbClient / CompanyDbHeaderFactory to ask org-api for a company's DB name ──
service.client.id=jobtasks-management-backend
service.client.secret=${SERVICE_CLIENT_SECRET:}
%test.service.client.secret=test-secret
service.client.org-api-url=${ORG_SERVICE_URL:http://localhost:8080}

# ─── FTP Server ───────────────────────────────────────────────────────────────
# FTP credentials and attachment paths are loaded from m07SystemParameter at runtime.

# ─── SMTP Configuration (task notification emails) ───────────────────────────

# ─── SMS Service (task notification SMS) ──────────────────────────────────────

# ─── Meta WhatsApp Cloud API (task notification WhatsApp) ────────────────────

# ─── Multipart upload limits ──────────────────────────────────────────────────
quarkus.http.limits.max-body-size=25M

# jakarta.mail reads its provider registry from META-INF/javamail.* resources
# inside the mail jar. GraalVM omits them unless listed, so without this the
# native image has no SMTP provider and every send fails with
# NoSuchProviderException before reaching the mail server.
quarkus.native.resources.includes=META-INF/javamail.default.providers,META-INF/javamail.charset.map,META-INF/javamail.default.address.map

# Notification Service, which owns provider credentials, templates and channel settings.
tenant.default-company-id=db_test2
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
mp.messaging.outgoing.email-notifications.connector=smallrye-kafka
mp.messaging.outgoing.email-notifications.topic=notifications.email.v1
mp.messaging.outgoing.email-notifications.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.email-notifications.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.sms-notifications.connector=smallrye-kafka
mp.messaging.outgoing.sms-notifications.topic=notifications.sms.v1
mp.messaging.outgoing.sms-notifications.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.sms-notifications.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.whatsapp-notifications.connector=smallrye-kafka
mp.messaging.outgoing.whatsapp-notifications.topic=notifications.whatsapp.v1
mp.messaging.outgoing.whatsapp-notifications.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.whatsapp-notifications.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Broker acknowledgements precede outbox removal; tenant identifiers select partitions.
notification.outbox.enabled=true
notification.outbox.table=jobtasks_notification_outbox
notification.outbox.poll-interval=1s
notification.outbox.batch-size=100
mp.messaging.outgoing.email-notifications.acks=all
mp.messaging.outgoing.email-notifications.enable.idempotence=true
mp.messaging.outgoing.email-notifications.linger.ms=5
mp.messaging.outgoing.email-notifications.batch.size=32768
mp.messaging.outgoing.email-notifications.delivery.timeout.ms=10000
mp.messaging.outgoing.email-notifications.request.timeout.ms=5000
mp.messaging.outgoing.sms-notifications.acks=all
mp.messaging.outgoing.sms-notifications.enable.idempotence=true
mp.messaging.outgoing.sms-notifications.linger.ms=5
mp.messaging.outgoing.sms-notifications.batch.size=32768
mp.messaging.outgoing.sms-notifications.delivery.timeout.ms=10000
mp.messaging.outgoing.sms-notifications.request.timeout.ms=5000
mp.messaging.outgoing.whatsapp-notifications.acks=all
mp.messaging.outgoing.whatsapp-notifications.enable.idempotence=true
mp.messaging.outgoing.whatsapp-notifications.linger.ms=5
mp.messaging.outgoing.whatsapp-notifications.batch.size=32768
mp.messaging.outgoing.whatsapp-notifications.delivery.timeout.ms=10000
mp.messaging.outgoing.whatsapp-notifications.request.timeout.ms=5000
