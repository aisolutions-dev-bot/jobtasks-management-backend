name: Build & Deploy Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aisolutions-dev-bot/jobtasks-management-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Spotless, Checkstyle, PMD, tests
        env:
          GITHUB_ACTOR: BCIDev25
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest pmdMain pmdTest test e2eTest jacocoTestReport --no-daemon

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Diff coverage (70% on changed lines)
        run: |
          pip install diff-cover==10.5.1
          REPORT=build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$REPORT" ]; then
            diff-cover "$REPORT" --compare-branch=${{ github.event.before }} --fail-under=70
          else
            echo "No JaCoCo report ($REPORT not found). Skipping diff coverage."
          fi

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build native image
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
        run: docker build -f Dockerfile.native --build-arg GITHUB_ACTOR=BCIDev25 --secret id=github_token,env=GITHUB_TOKEN -t ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} -t ${{ env.IMAGE }}:latest .

      - name: Extract native executable for end-to-end verification
        run: |
          mkdir -p build/native-e2e
          container_id=$(docker create "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}")
          trap 'docker rm "$container_id"' EXIT
          docker cp "$container_id:/app/application" build/native-e2e/jobtasks-service
          chmod +x build/native-e2e/jobtasks-service

      - name: Verify native outbox delivery
        env:
          GITHUB_ACTOR: BCIDev25
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}
          JOBTASKS_NATIVE_RUNNER: ${{ github.workspace }}/build/native-e2e/jobtasks-service
        run: ./gradlew e2eTest --no-daemon

      - name: Push verified native image
        run: |
          docker push ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    runs-on: [self-hosted, preview-vps]
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install the version-controlled service configuration
        run: install -m 644 deploy/jobtasks-backend.preview.yml /home/ubuntu/deploy/preview/jobtasks-backend.preview.yml

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u BCIDev25 --password-stdin

      - name: Pull new image
        run: docker pull ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Deploy on VPS
        working-directory: /home/ubuntu/deploy/preview
        run: IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f jobtasks-backend.preview.yml up -d

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/8083' 2>/dev/null; then
              echo "HEALTHY"; exit 0
            fi
            sleep 10
          done
          IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f /home/ubuntu/deploy/preview/jobtasks-backend.preview.yml ps
          exit 1
